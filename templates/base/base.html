<!DOCTYPE html>
{% load static %}
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sentinel XO{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon/icon.svg' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/icon-32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/icon-16.png' %}">
  <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
  <meta name="theme-color" content="#080b10">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <!--
    NOTA: Tailwind sigue cargándose vía CDN para no romper utilidades que puedan
    usar otras plantillas. Es un paso aparte (auditar uso real y compilar/quitar).
    Ver la nota que acompaña a este archivo.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script>
    // Incluir CSRF token en todos los requests HTMX automáticamente
    document.addEventListener('DOMContentLoaded', function() {
      document.body.addEventListener('htmx:configRequest', function(evt) {
        const token = document.cookie.split(';')
          .map(c => c.trim())
          .find(c => c.startsWith('csrftoken='));
        if (token) {
          evt.detail.headers['X-CSRFToken'] = token.split('=')[1];
        }
      });
    });
  </script>
  <script>
  // Cargar Chart.js con fallback múltiple
  (function() {
    var urls = [
      "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js",
      "https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js",
      "/static/js/chart.umd.min.js"
    ];
    function tryLoad(i) {
      if (i >= urls.length) return;
      var s = document.createElement("script");
      s.src = urls[i];
      s.onerror = function() { tryLoad(i + 1); };
      document.head.appendChild(s);
    }
    tryLoad(0);
  })();
  </script>

  <style>
    /* ════════════════════════════════════════════════════════════════════
       SENTINEL XO — DESIGN SYSTEM
       Una sola fuente de verdad. Todo componente consume tokens; nada usa
       números mágicos ni rgba sueltos. Los nombres de variable y de clase
       son retrocompatibles con las plantillas existentes.
       ════════════════════════════════════════════════════════════════════ */

    :root {
      /* ── Marca ───────────────────────────────────────────────── */
      --accent:        #2563eb;                 /* primario de marca (legacy) */
      --accent-strong: #1d4ed8;                 /* hover / pressed            */
      --accent-soft:   #60a5fa;                 /* texto de marca sobre oscuro*/
      --accent-dim:    rgba(37,99,235,0.12);    /* legacy                     */
      --accent-border: rgba(37,99,235,0.20);    /* legacy                     */
      --purple:        #7c3aed;                 /* marca secundaria (legacy)  */
      --purple-soft:   #a78bfa;

      /* ── Superficies ─────────────────────────────────────────── */
      --bg:        #080b10;
      --surface:   #0d1117;                     /* legacy */
      --card:      #0d1117;                     /* legacy */
      --surface-2: #0f1520;                     /* compañera del gradiente (kpi) */
      --raise:     rgba(255,255,255,0.03);      /* fondo de input / ghost suave  */

      /* ── Líneas ──────────────────────────────────────────────── */
      --border:        rgba(255,255,255,0.06);
      --border-hover:  rgba(255,255,255,0.10);
      --border-soft:   rgba(255,255,255,0.04);
      --border-faint:  rgba(255,255,255,0.03);
      --hairline:      rgba(255,255,255,0.05);

      /* ── Texto ───────────────────────────────────────────────── */
      --text:    #f1f5f9;
      --text-2:  #cbd5e1;
      --text-3:  #8b9cb8;
      --text-4:  #64748b;

      /* ── Estado (semántico — nunca decorativo) ───────────────── */
      --green:   #10b981;   --amber:  #f59e0b;   --red:  #ef4444;   /* legacy */
      --success: #10b981;   --warn:   #f59e0b;   --danger: #ef4444;
      --info:    #60a5fa;   --teal:   #06b6d4;

      --success-tint: rgba(16,185,129,0.10); --success-line: rgba(16,185,129,0.18); --success-glow: rgba(16,185,129,0.5);
      --warn-tint:    rgba(245,158,11,0.10); --warn-line:    rgba(245,158,11,0.18); --warn-glow:    rgba(245,158,11,0.4);
      --danger-tint:  rgba(239,68,68,0.10);  --danger-line:  rgba(239,68,68,0.18);
      --info-tint:    rgba(37,99,235,0.10);  --info-line:    rgba(37,99,235,0.18);
      --gray-tint:    rgba(100,116,139,0.10);--gray-line:    rgba(100,116,139,0.18);
      --purple-tint:  rgba(124,58,237,0.12); --purple-line:  rgba(124,58,237,0.20);
      --teal-tint:    rgba(6,182,212,0.10);  --teal-line:    rgba(6,182,212,0.20);

      /* ── Tipografía ──────────────────────────────────────────── */
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;

      --fs-3xs:  0.5625rem;  /*  9px — micro-labels en mayúscula */
      --fs-2xs:  0.625rem;   /* 10px — labels, badges            */
      --fs-xs:   0.6875rem;  /* 11px — meta secundario           */
      --fs-sm:   0.75rem;    /* 12px — controles, body small     */
      --fs-base: 0.8125rem;  /* 13px — body base                 */
      --fs-md:   0.875rem;   /* 14px — título de página          */
      --fs-lg:   1rem;       /* 16px                             */
      --fs-xl:   1.375rem;   /* 22px — kpi compacto              */
      --fs-2xl:  1.5rem;     /* 24px                             */
      --fs-3xl:  1.875rem;   /* 30px — kpi value                 */

      --fw-normal: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
      --tracking-label: 0.09em;  /* labels en mayúscula */
      --tracking-wide:  0.07em;

      /* ── Espaciado (ritmo base 4) ────────────────────────────── */
      --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
      --space-5: 20px; --space-6: 24px; --space-8: 32px;

      /* ── Radio (un solo sistema de elevación) ────────────────── */
      --radius-sm:   6px;   --radius-md: 8px;  --radius-lg: 10px;  --radius-xl: 14px;
      --radius-pill: 9999px; --radius-bar: 2px;

      /* ── Elevación (usar con mesura) ─────────────────────────── */
      --shadow-sm:  0 1px 2px rgba(0,0,0,0.30);
      --shadow-md:  0 6px 18px rgba(0,0,0,0.30);
      --shadow-pop: 0 10px 30px rgba(0,0,0,0.45);

      /* ── Movimiento ──────────────────────────────────────────── */
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --dur-fast: 150ms; --dur-med: 250ms; --dur-slow: 600ms;

      /* ── Focus ───────────────────────────────────────────────── */
      --ring: 0 0 0 3px rgba(37,99,235,0.35);

      /* ── Capas (z-index) ─────────────────────────────────────── */
      --z-topbar: 1; --z-overlay: 40; --z-sidebar: 50; --z-toast: 9999;
    }

    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--fs-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(37,99,235,0.30); color: #fff; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: var(--radius-bar); }

    /* Focus visible coherente para todo elemento interactivo */
    a:focus-visible, button:focus-visible, [tabindex]:focus-visible,
    input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none;
      box-shadow: var(--ring);
    }

    /* ── HTMX ──────────────────────────────────────────────────── */
    .htmx-indicator { opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }

    /* ── Mono (solo para datos) ────────────────────────────────── */
    .mono { font-family: var(--font-mono); }

    /* ── Cards ─────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      position: relative;
      overflow: hidden;
      transition: border-color var(--dur-fast) var(--ease);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--hairline), transparent);
      pointer-events: none;
    }
    .card.accent-top::before {
      background: linear-gradient(90deg, transparent, rgba(37,99,235,0.5), rgba(124,58,237,0.3), transparent);
    }
    .card:hover { border-color: var(--border-hover); }

    .card-header {
      padding: var(--space-4) 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title {
      font-size: var(--fs-sm);
      font-weight: var(--fw-semibold);
      color: var(--text-2);
      letter-spacing: 0.01em;
    }

    /* ── Badges ────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: var(--space-1);
      padding: 2px var(--space-2);
      border-radius: var(--radius-sm);
      font-size: var(--fs-2xs);
      font-weight: var(--fw-semibold);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .badge-ok   { background: var(--success-tint); color: var(--success);    border: 1px solid var(--success-line); }
    .badge-warn { background: var(--warn-tint);    color: var(--warn);       border: 1px solid var(--warn-line); }
    .badge-crit { background: var(--danger-tint);  color: var(--danger);     border: 1px solid var(--danger-line); }
    .badge-blue { background: var(--info-tint);    color: var(--accent-soft);border: 1px solid var(--info-line); }
    .badge-gray { background: var(--gray-tint);    color: var(--text-4);     border: 1px solid var(--gray-line); }

    /* ── Status dots ───────────────────────────────────────────── */
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: var(--radius-pill); flex-shrink: 0; }
    .dot-on   { background: var(--success); box-shadow: 0 0 8px var(--success-glow); }
    .dot-warn { background: var(--warn);    box-shadow: 0 0 8px var(--warn-glow); }
    .dot-off  { background: var(--danger); }
    .dot-idle { background: var(--text-4); }
    @keyframes pulse-dot { 0%,100% { opacity: 1 } 50% { opacity: 0.45 } }
    .dot-pulse { animation: pulse-dot 2s ease-in-out infinite; }

    /* ── Progress bars ─────────────────────────────────────────── */
    .bar-track { height: 3px; background: rgba(255,255,255,0.05); border-radius: var(--radius-bar); overflow: hidden; }
    .bar-fill  { height: 3px; border-radius: var(--radius-bar); transition: width var(--dur-slow) var(--ease); }
    .bar-blue  { background: var(--accent); }
    .bar-green { background: var(--success); }
    .bar-amber { background: var(--warn); }
    .bar-red   { background: var(--danger); }

    /* ── Inputs ────────────────────────────────────────────────── */
    .px-input {
      background: var(--raise);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      padding: var(--space-2) var(--space-3);
      font-size: var(--fs-sm);
      font-family: var(--font-sans);
      outline: none;
      transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
      width: 100%;
    }
    .px-input::placeholder { color: var(--text-4); }
    .px-input:focus { border-color: rgba(37,99,235,0.5); background: rgba(37,99,235,0.04); }
    .px-input:focus-visible { box-shadow: var(--ring); }
    select.px-input { cursor: pointer; }

    /* ── Buttons ───────────────────────────────────────────────── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: 7px var(--space-4);
      background: var(--accent);
      color: #fff;
      border: none; border-radius: var(--radius-md);
      font-size: var(--fs-sm); font-weight: var(--fw-semibold); font-family: inherit;
      cursor: pointer; text-decoration: none;
      transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
      letter-spacing: 0.01em;
    }
    .btn-primary:hover  { background: var(--accent-strong); }
    .btn-primary:active { transform: scale(0.97); }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: 7px var(--space-3);
      background: transparent;
      color: var(--text-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--fs-sm); font-weight: var(--fw-medium); font-family: inherit;
      cursor: pointer; text-decoration: none;
      transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .btn-ghost:hover { border-color: rgba(37,99,235,0.3); color: var(--accent-soft); background: var(--accent-dim); }

    .btn-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-3);
      cursor: pointer; font-family: inherit;
      transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .btn-icon:hover { border-color: var(--border-hover); color: var(--text-2); background: var(--raise); }

    .btn-pdf {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px var(--space-3);
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-sm);
      color: var(--accent-soft); font-size: var(--fs-xs); font-weight: var(--fw-semibold); font-family: inherit;
      cursor: pointer; text-decoration: none;
      transition: background var(--dur-fast) var(--ease);
    }
    .btn-pdf:hover { background: rgba(37,99,235,0.2); }

    /* ── Tables ────────────────────────────────────────────────── */
    .px-table { width: 100%; border-collapse: collapse; }
    .px-table th {
      padding: var(--space-2) 18px; text-align: left;
      font-size: var(--fs-3xs); font-weight: var(--fw-semibold);
      letter-spacing: var(--tracking-label); text-transform: uppercase;
      color: var(--text-3);
      border-bottom: 1px solid var(--border-soft);
    }
    .px-table td {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border-faint);
      color: var(--text-2);
    }
    .px-table tbody tr:last-child td { border-bottom: none; }
    .px-table tbody tr:hover td { background: rgba(255,255,255,0.015); }

    /* ── KPI cards ─────────────────────────────────────────────── */
    .kpi-card {
      background: linear-gradient(135deg, var(--card) 0%, var(--surface-2) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      position: relative;
      overflow: hidden;
      transition: border-color var(--dur-med) var(--ease);
    }
    .kpi-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--hairline), transparent);
    }
    .kpi-card.kpi-accent { border-color: rgba(37,99,235,0.25); }
    .kpi-card.kpi-accent::before { background: linear-gradient(90deg, transparent, rgba(37,99,235,0.5), rgba(124,58,237,0.3), transparent); }
    .kpi-card:hover { border-color: var(--border-hover); }
    .kpi-label { font-size: var(--fs-2xs); font-weight: var(--fw-medium); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-3); margin-bottom: var(--space-3); }
    .kpi-value { font-size: var(--fs-3xl); font-weight: var(--fw-bold); line-height: 1; color: var(--text); letter-spacing: -0.03em; margin-bottom: 6px; }

    /* ── Nav ───────────────────────────────────────────────────── */
    .nav-link {
      display: flex; align-items: center; gap: 9px;
      padding: var(--space-2) var(--space-3); margin: 1px var(--space-2);
      border-radius: var(--radius-md);
      font-size: var(--fs-sm); font-weight: var(--fw-medium);
      color: var(--text-3);
      text-decoration: none;
      transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
      border: 1px solid transparent;
    }
    .nav-link:hover { background: var(--raise); color: var(--text-2); }
    .nav-link.active { background: var(--accent-dim); color: var(--accent-soft); border-color: var(--info-line); }
    .nav-link svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.7; }
    .nav-link.active svg { opacity: 1; }

    /* ── Avatar ────────────────────────────────────────────────── */
    .avatar {
      width: 32px; height: 32px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-xs); font-weight: var(--fw-bold); flex-shrink: 0;
    }
    .av-blue   { background: var(--accent-dim);  border: 1px solid rgba(37,99,235,0.2);  color: var(--accent-soft); }
    .av-purple { background: var(--purple-tint); border: 1px solid var(--purple-line);   color: var(--purple-soft); }
    .av-green  { background: var(--success-tint);border: 1px solid rgba(16,185,129,0.2); color: #34d399; }
    .av-amber  { background: var(--warn-tint);   border: 1px solid rgba(245,158,11,0.2); color: #fbbf24; }
    .av-teal   { background: var(--teal-tint);   border: 1px solid var(--teal-line);     color: #22d3ee; }

    /* ── Utilidades de fila / divisor ──────────────────────────── */
    .row-hover { transition: background var(--dur-fast) var(--ease); }
    .row-hover:hover { background: rgba(255,255,255,0.018); }
    .divider { height: 1px; background: var(--border-soft); }

    /* ── Grids (NUEVO — migrar los inline aquí) ────────────────── */
    /* Reemplazan a los style="display:grid;grid-template-columns:..." inline.
       En vez de <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
       usar <div class="kpi-grid-4">. La responsividad ya está cubierta en layout. */
    .kpi-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
    .kpi-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
    .grid-2col  { display: grid; grid-template-columns: 1fr 1fr;        gap: var(--space-4); }

    /* ── Animaciones ───────────────────────────────────────────── */
    @keyframes scan-move {
      0%   { top: 0;    opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    .scan-line {
      position: absolute; left: 0; right: 0; height: 1px; pointer-events: none; z-index: 0;
      background: linear-gradient(90deg, transparent, rgba(37,99,235,0.35), rgba(124,58,237,0.25), transparent);
      animation: scan-move 6s ease-in-out infinite;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fu   { animation: fadeUp 0.3s var(--ease) both; }
    .fu-1 { animation: fadeUp 0.3s 0.05s var(--ease) both; }
    .fu-2 { animation: fadeUp 0.3s 0.10s var(--ease) both; }
    .fu-3 { animation: fadeUp 0.3s 0.15s var(--ease) both; }
    .fu-4 { animation: fadeUp 0.3s 0.20s var(--ease) both; }

    /* ── Toasts ────────────────────────────────────────────────── */
    @keyframes toastIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    .toast-stack {
      position: fixed; top: 18px; right: 18px; z-index: var(--z-toast);
      display: flex; flex-direction: column; gap: var(--space-2); max-width: 320px;
    }
    .toast {
      animation: toastIn var(--dur-med) var(--ease);
      border-radius: var(--radius-lg);
      padding: 11px var(--space-4);
      font-size: var(--fs-sm); font-weight: var(--fw-medium);
      display: flex; align-items: center; gap: var(--space-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-pop);
    }
    .toast-success { background: #0a1f15; color: var(--success);     border-color: var(--success-line); }
    .toast-error   { background: #1a0a0a; color: var(--danger);      border-color: var(--danger-line); }
    .toast-warning { background: #1a150a; color: var(--warn);        border-color: var(--warn-line); }
    .toast-info    { background: #0a0f1a; color: var(--accent-soft); border-color: var(--info-line); }

    /* ── Responsive helpers ────────────────────────────────────── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* Las utilidades .kpi-grid-* / .grid-2col ya colapsan en layout.html.
       Los selectores [style*="..."] de abajo son TRANSITORIOS: cubren las
       plantillas que todavía declaran el grid inline. A medida que migres a
       las clases de grid, se pueden ir borrando. */
    @media (max-width: 600px) {
      .btn-ghost .btn-txt,
      .btn-primary .btn-txt { display: none !important; }
    }
    @media (max-width: 768px) {
      div[style*="grid-template-columns:repeat(4"] { grid-template-columns: repeat(2,1fr) !important; }
      div[style*="grid-template-columns:repeat(3"] { grid-template-columns: repeat(2,1fr) !important; }
      div[style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:1fr 1.1fr"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:1.4fr 1fr"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:0.65fr"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:1.35fr"] { grid-template-columns: 1fr !important; }
      .px-table { font-size: var(--fs-xs); }
      .px-table th, .px-table td { padding: var(--space-2) var(--space-3); }
    }
    @media (max-width: 480px) {
      div[style*="grid-template-columns:repeat(4"] { grid-template-columns: repeat(2,1fr) !important; }
      div[style*="grid-template-columns:repeat(3"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:repeat(2"] { grid-template-columns: 1fr !important; }
      .kpi-value { font-size: var(--fs-xl) !important; }
      .kpi-card { padding: var(--space-4) !important; }
      .rt-grid { grid-template-columns: 1fr !important; }
      .summary-bar { grid-template-columns: repeat(2,1fr) !important; }
      .px-table .col-hide-mobile { display: none !important; }
    }

    /* ── Accesibilidad: respetar reduced-motion ────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .scan-line { display: none; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

{% if messages %}
<div class="toast-stack" id="toast-stack">
  {% for message in messages %}
  <div class="toast
    {% if 'success' in message.tags %}toast-success
    {% elif 'error' in message.tags %}toast-error
    {% elif 'warning' in message.tags %}toast-warning
    {% else %}toast-info{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
<script>setTimeout(()=>{const t=document.getElementById('toast-stack');if(t)t.remove();},4000);</script>
{% endif %}

{% block body %}{% endblock %}
</body>
</html>
