<!DOCTYPE html>
{% load static %}
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sentinel XO{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon/icon.svg' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/icon-32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/icon-16.png' %}">
  <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
  <meta name="theme-color" content="#05070d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!--
    NOTA: Tailwind sigue cargándose vía CDN para no romper utilidades que puedan
    usar otras plantillas. Es un paso aparte (auditar uso real y compilar/quitar).
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script>
    // Incluir CSRF token en todos los requests HTMX automáticamente
    document.addEventListener('DOMContentLoaded', function() {
      document.body.addEventListener('htmx:configRequest', function(evt) {
        const token = document.cookie.split(';')
          .map(c => c.trim())
          .find(c => c.startsWith('csrftoken='));
        if (token) {
          evt.detail.headers['X-CSRFToken'] = token.split('=')[1];
        }
      });
    });
  </script>
  <script>
  // Cargar Chart.js con fallback múltiple
  (function() {
    var urls = [
      "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js",
      "https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js",
      "/static/js/chart.umd.min.js"
    ];
    function tryLoad(i) {
      if (i >= urls.length) return;
      var s = document.createElement("script");
      s.src = urls[i];
      s.onerror = function() { tryLoad(i + 1); };
      document.head.appendChild(s);
    }
    tryLoad(0);
  })();
  </script>

  <style>
    /* ════════════════════════════════════════════════════════════════════
       SENTINEL XO — DESIGN SYSTEM · EDICIÓN NEÓN
       Mismos nombres de token y de clase que la versión anterior (todo
       retrocompatible). Cambian los VALORES de los tokens y el glow en los
       componentes de señal. El neón codifica estado, no decora.
       ════════════════════════════════════════════════════════════════════ */

    :root {
      /* ── Marca ───────────────────────────────────────────────── */
      --accent:        #2f7bff;
      --accent-strong: #1f5fe0;
      --accent-soft:   #6fd3ff;
      --accent-dim:    rgba(47,123,255,0.14);
      --accent-border: rgba(47,123,255,0.30);
      --accent-glow:   rgba(47,123,255,0.55);
      --purple:        #9b6bff;
      --purple-soft:   #c4a8ff;
      --cyan:          #22e6ff;
      --cyan-glow:     rgba(34,230,255,0.55);

      /* ── Superficies (más profundas) ─────────────────────────── */
      --bg:        #05070d;
      --surface:   #0a0f1a;
      --card:      #0a0f1a;
      --surface-2: #0c1320;
      --raise:     rgba(120,160,220,0.04);

      /* ── Líneas (tinte frío) ─────────────────────────────────── */
      --border:        rgba(120,160,220,0.10);
      --border-hover:  rgba(120,160,220,0.18);
      --border-soft:   rgba(120,160,220,0.06);
      --border-faint:  rgba(120,160,220,0.04);
      --hairline:      rgba(120,160,220,0.07);

      /* ── Texto ───────────────────────────────────────────────── */
      --text:    #eaf2ff;
      --text-2:  #b9c8e0;
      --text-3:  #8295b3;
      --text-4:  #586a88;

      /* ── Estado (neón = señal) ───────────────────────────────── */
      --green:   #00f5a0;   --amber:  #ffb02e;   --red:  #ff3b6b;
      --success: #00f5a0;   --warn:   #ffb02e;   --danger: #ff3b6b;
      --info:    #6fd3ff;   --teal:   #22e6ff;

      --success-tint: rgba(0,245,160,0.10); --success-line: rgba(0,245,160,0.24); --success-glow: rgba(0,245,160,0.55);
      --warn-tint:    rgba(255,176,46,0.10);--warn-line:    rgba(255,176,46,0.24);--warn-glow:    rgba(255,176,46,0.50);
      --danger-tint:  rgba(255,59,107,0.10);--danger-line:  rgba(255,59,107,0.26);--danger-glow:  rgba(255,59,107,0.55);
      --info-tint:    rgba(47,123,255,0.10);--info-line:    rgba(47,123,255,0.24);
      --gray-tint:    rgba(120,140,170,0.10);--gray-line:   rgba(120,140,170,0.20);
      --purple-tint:  rgba(155,107,255,0.12);--purple-line: rgba(155,107,255,0.26);
      --teal-tint:    rgba(34,230,255,0.10); --teal-line:   rgba(34,230,255,0.24);

      /* ── Tipografía ──────────────────────────────────────────── */
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;

      --fs-3xs:  0.5625rem;  --fs-2xs:  0.625rem;  --fs-xs:  0.6875rem;
      --fs-sm:   0.75rem;    --fs-base: 0.8125rem; --fs-md:  0.875rem;
      --fs-lg:   1rem;       --fs-xl:   1.375rem;  --fs-2xl: 1.5rem;
      --fs-3xl:  1.875rem;

      --fw-normal: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
      --tracking-label: 0.09em;
      --tracking-wide:  0.07em;

      /* ── Espaciado (ritmo base 4) ────────────────────────────── */
      --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
      --space-5: 20px; --space-6: 24px; --space-8: 32px;

      /* ── Radio ───────────────────────────────────────────────── */
      --radius-sm:   6px;   --radius-md: 8px;  --radius-lg: 10px;  --radius-xl: 14px;
      --radius-pill: 9999px; --radius-bar: 2px;

      /* ── Elevación ───────────────────────────────────────────── */
      --shadow-sm:  0 1px 2px rgba(0,0,0,0.40);
      --shadow-md:  0 6px 18px rgba(0,0,0,0.40);
      --shadow-pop: 0 10px 34px rgba(0,0,0,0.55);

      /* ── Movimiento ──────────────────────────────────────────── */
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --dur-fast: 150ms; --dur-med: 250ms; --dur-slow: 600ms;

      /* ── Focus ───────────────────────────────────────────────── */
      --ring: 0 0 0 3px rgba(47,123,255,0.40);

      /* ── Capas ───────────────────────────────────────────────── */
      --z-topbar: 1; --z-overlay: 40; --z-sidebar: 50; --z-toast: 9999;
    }

    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--fs-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(34,230,255,0.30); color: #fff; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(120,160,220,0.14); border-radius: var(--radius-bar); }

    a:focus-visible, button:focus-visible, [tabindex]:focus-visible,
    input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none; box-shadow: var(--ring);
    }

    .htmx-indicator { opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }

    .mono { font-family: var(--font-mono); }

    /* ── Atmósfera neón del área de contenido ──────────────────── */
    /* Targetea #main-area (definido en layout.html): grid + halos sutiles
       como fondo estático mientras el contenido scrollea por encima. */
    #main-area::before {
      content: '';
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(circle at 14% 8%, rgba(34,230,255,0.06), transparent 40%),
        radial-gradient(circle at 90% 92%, rgba(155,107,255,0.06), transparent 42%),
        linear-gradient(rgba(120,160,220,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,160,220,0.022) 1px, transparent 1px);
      background-size: auto, auto, 46px 46px, 46px 46px;
    }

    /* ── Cards ─────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      position: relative; overflow: hidden;
      transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--hairline), transparent);
      pointer-events: none;
    }
    .card.accent-top::before {
      background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
      box-shadow: 0 0 12px var(--cyan-glow);
    }
    .card:hover { border-color: var(--border-hover); }

    .card-header {
      padding: var(--space-4) 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-2); letter-spacing: 0.01em; }

    /* ── Badges (glow sutil de estado) ─────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: var(--space-1);
      padding: 2px var(--space-2); border-radius: var(--radius-sm);
      font-size: var(--fs-2xs); font-weight: var(--fw-semibold);
      letter-spacing: 0.03em; white-space: nowrap;
    }
    .badge-ok   { background: var(--success-tint); color: var(--success);    border: 1px solid var(--success-line); box-shadow: 0 0 10px rgba(0,245,160,0.10); }
    .badge-warn { background: var(--warn-tint);    color: var(--warn);       border: 1px solid var(--warn-line);    box-shadow: 0 0 10px rgba(255,176,46,0.10); }
    .badge-crit { background: var(--danger-tint);  color: var(--danger);     border: 1px solid var(--danger-line);  box-shadow: 0 0 12px rgba(255,59,107,0.12); }
    .badge-blue { background: var(--info-tint);    color: var(--accent-soft);border: 1px solid var(--info-line); }
    .badge-gray { background: var(--gray-tint);    color: var(--text-4);     border: 1px solid var(--gray-line); }

    /* ── Status dots (glow = vida) ─────────────────────────────── */
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: var(--radius-pill); flex-shrink: 0; }
    .dot-on   { background: var(--success); box-shadow: 0 0 10px var(--success-glow), 0 0 3px #fff; }
    .dot-warn { background: var(--warn);    box-shadow: 0 0 10px var(--warn-glow); }
    .dot-off  { background: var(--danger);  box-shadow: 0 0 11px var(--danger-glow); }
    .dot-idle { background: var(--text-4); }
    @keyframes pulse-dot { 0%,100% { opacity: 1 } 50% { opacity: 0.45 } }
    .dot-pulse { animation: pulse-dot 2s ease-in-out infinite; }

    /* ── Progress bars (glow según color) ──────────────────────── */
    .bar-track { height: 3px; background: rgba(120,160,220,0.08); border-radius: var(--radius-bar); overflow: hidden; }
    .bar-fill  { height: 3px; border-radius: var(--radius-bar); transition: width var(--dur-slow) var(--ease); }
    .bar-blue  { background: var(--accent);  box-shadow: 0 0 8px var(--accent-glow); }
    .bar-green { background: var(--success); box-shadow: 0 0 8px var(--success-glow); }
    .bar-amber { background: var(--warn);    box-shadow: 0 0 8px var(--warn-glow); }
    .bar-red   { background: var(--danger);  box-shadow: 0 0 8px var(--danger-glow); }

    /* ── Inputs ────────────────────────────────────────────────── */
    .px-input {
      background: var(--raise);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      padding: var(--space-2) var(--space-3);
      font-size: var(--fs-sm); font-family: var(--font-sans);
      outline: none;
      transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
      width: 100%;
    }
    .px-input::placeholder { color: var(--text-4); }
    .px-input:focus { border-color: rgba(47,123,255,0.55); background: rgba(47,123,255,0.05); box-shadow: 0 0 14px rgba(47,123,255,0.14); }
    .px-input:focus-visible { box-shadow: var(--ring); }
    select.px-input { cursor: pointer; }

    /* ── Buttons ───────────────────────────────────────────────── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: 7px var(--space-4);
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-md);
      font-size: var(--fs-sm); font-weight: var(--fw-semibold); font-family: inherit;
      cursor: pointer; text-decoration: none;
      transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
      letter-spacing: 0.01em;
      box-shadow: 0 0 16px rgba(47,123,255,0.22);
    }
    .btn-primary:hover  { background: var(--accent-strong); box-shadow: 0 0 22px rgba(47,123,255,0.40); }
    .btn-primary:active { transform: scale(0.97); }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: 7px var(--space-3);
      background: transparent; color: var(--text-3);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      font-size: var(--fs-sm); font-weight: var(--fw-medium); font-family: inherit;
      cursor: pointer; text-decoration: none;
      transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
    }
    .btn-ghost:hover { border-color: rgba(34,230,255,0.40); color: var(--accent-soft); background: var(--accent-dim); box-shadow: 0 0 14px rgba(34,230,255,0.12); }

    .btn-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      background: transparent; border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-3);
      cursor: pointer; font-family: inherit;
      transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .btn-icon:hover { border-color: var(--border-hover); color: var(--text-2); background: var(--raise); }

    .btn-pdf {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px var(--space-3);
      background: var(--accent-dim); border: 1px solid var(--accent-border);
      border-radius: var(--radius-sm);
      color: var(--accent-soft); font-size: var(--fs-xs); font-weight: var(--fw-semibold); font-family: inherit;
      cursor: pointer; text-decoration: none;
      transition: background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
    }
    .btn-pdf:hover { background: rgba(47,123,255,0.22); box-shadow: 0 0 14px rgba(47,123,255,0.18); }

    /* ── Tables ────────────────────────────────────────────────── */
    .px-table { width: 100%; border-collapse: collapse; }
    .px-table th {
      padding: var(--space-2) 18px; text-align: left;
      font-size: var(--fs-3xs); font-weight: var(--fw-semibold);
      letter-spacing: var(--tracking-label); text-transform: uppercase;
      color: var(--text-3); border-bottom: 1px solid var(--border-soft);
    }
    .px-table td { padding: 13px 18px; border-bottom: 1px solid var(--border-faint); color: var(--text-2); }
    .px-table tbody tr:last-child td { border-bottom: none; }
    .px-table tbody tr:hover td { background: rgba(34,230,255,0.022); }

    /* ── KPI cards (hairline neón superior) ────────────────────── */
    .kpi-card {
      background: linear-gradient(160deg, var(--surface-2) 0%, var(--card) 100%);
      border: 1px solid var(--border); border-radius: var(--radius-xl);
      padding: var(--space-5);
      position: relative; overflow: hidden;
      transition: border-color var(--dur-med) var(--ease), box-shadow var(--dur-med) var(--ease);
    }
    .kpi-card::before {
      content: ''; position: absolute; top: 0; left: 14px; right: 14px; height: 2px; border-radius: 2px;
      background: var(--accent); box-shadow: 0 0 14px var(--accent-glow);
    }
    .kpi-card.kpi-accent { border-color: var(--accent-border); box-shadow: inset 0 0 30px rgba(47,123,255,0.05); }
    .kpi-card.kpi-accent::before { background: var(--cyan); box-shadow: 0 0 16px var(--cyan-glow); }
    .kpi-card:hover { border-color: var(--border-hover); }
    .kpi-label { font-size: var(--fs-2xs); font-weight: var(--fw-medium); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-3); margin-bottom: var(--space-3); }
    .kpi-value { font-size: var(--fs-3xl); font-weight: var(--fw-bold); line-height: 1; color: var(--text); letter-spacing: -0.03em; margin-bottom: 6px; }

    /* ── Nav (activo iluminado) ────────────────────────────────── */
    .nav-link {
      display: flex; align-items: center; gap: 9px;
      padding: var(--space-2) var(--space-3); margin: 1px var(--space-2);
      border-radius: var(--radius-md);
      font-size: var(--fs-sm); font-weight: var(--fw-medium);
      color: var(--text-3); text-decoration: none;
      transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
      border: 1px solid transparent;
    }
    .nav-link:hover { background: var(--raise); color: var(--text-2); }
    .nav-link.active {
      background: var(--accent-dim); color: var(--accent-soft);
      border-color: var(--info-line);
      box-shadow: 0 0 16px rgba(34,230,255,0.14), inset 0 0 12px rgba(34,230,255,0.05);
    }
    .nav-link svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.7; }
    .nav-link.active svg { opacity: 1; }

    /* ── Avatar ────────────────────────────────────────────────── */
    .avatar {
      width: 32px; height: 32px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-xs); font-weight: var(--fw-bold); flex-shrink: 0;
    }
    .av-blue   { background: var(--accent-dim);  border: 1px solid var(--accent-border);  color: var(--accent-soft); }
    .av-purple { background: var(--purple-tint); border: 1px solid var(--purple-line);    color: var(--purple-soft); }
    .av-green  { background: var(--success-tint);border: 1px solid var(--success-line);   color: var(--success); }
    .av-amber  { background: var(--warn-tint);   border: 1px solid var(--warn-line);      color: var(--warn); }
    .av-teal   { background: var(--teal-tint);   border: 1px solid var(--teal-line);      color: var(--teal); }

    /* ── Utilidades ────────────────────────────────────────────── */
    .row-hover { transition: background var(--dur-fast) var(--ease); }
    .row-hover:hover { background: rgba(34,230,255,0.022); }
    .divider { height: 1px; background: var(--border-soft); }

    .kpi-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
    .kpi-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
    .grid-2col  { display: grid; grid-template-columns: 1fr 1fr;        gap: var(--space-4); }

    /* ── Animaciones ───────────────────────────────────────────── */
    @keyframes scan-move {
      0% { top: 0; opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { top: 100%; opacity: 0; }
    }
    .scan-line {
      position: absolute; left: 0; right: 0; height: 1px; pointer-events: none; z-index: 0;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
      box-shadow: 0 0 10px var(--cyan-glow);
      animation: scan-move 7s ease-in-out infinite;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fu   { animation: fadeUp 0.3s var(--ease) both; }
    .fu-1 { animation: fadeUp 0.3s 0.05s var(--ease) both; }
    .fu-2 { animation: fadeUp 0.3s 0.10s var(--ease) both; }
    .fu-3 { animation: fadeUp 0.3s 0.15s var(--ease) both; }
    .fu-4 { animation: fadeUp 0.3s 0.20s var(--ease) both; }

    /* ── Toasts ────────────────────────────────────────────────── */
    @keyframes toastIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    .toast-stack {
      position: fixed; top: 18px; right: 18px; z-index: var(--z-toast);
      display: flex; flex-direction: column; gap: var(--space-2); max-width: 320px;
    }
    .toast {
      animation: toastIn var(--dur-med) var(--ease);
      border-radius: var(--radius-lg);
      padding: 11px var(--space-4);
      font-size: var(--fs-sm); font-weight: var(--fw-medium);
      display: flex; align-items: center; gap: var(--space-2);
      border: 1px solid var(--border); box-shadow: var(--shadow-pop);
    }
    .toast-success { background: #06140f; color: var(--success);     border-color: var(--success-line); }
    .toast-error   { background: #170810; color: var(--danger);      border-color: var(--danger-line); }
    .toast-warning { background: #161005; color: var(--warn);        border-color: var(--warn-line); }
    .toast-info    { background: #060d18; color: var(--accent-soft); border-color: var(--info-line); }

    /* ── Responsive helpers ────────────────────────────────────── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    @media (max-width: 600px) {
      .btn-ghost .btn-txt, .btn-primary .btn-txt { display: none !important; }
    }
    @media (max-width: 768px) {
      div[style*="grid-template-columns:repeat(4"] { grid-template-columns: repeat(2,1fr) !important; }
      div[style*="grid-template-columns:repeat(3"] { grid-template-columns: repeat(2,1fr) !important; }
      div[style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:1fr 1.1fr"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:1.4fr 1fr"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:0.65fr"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:1.35fr"] { grid-template-columns: 1fr !important; }
      .px-table { font-size: var(--fs-xs); }
      .px-table th, .px-table td { padding: var(--space-2) var(--space-3); }
    }
    @media (max-width: 480px) {
      div[style*="grid-template-columns:repeat(4"] { grid-template-columns: repeat(2,1fr) !important; }
      div[style*="grid-template-columns:repeat(3"] { grid-template-columns: 1fr !important; }
      div[style*="grid-template-columns:repeat(2"] { grid-template-columns: 1fr !important; }
      .kpi-value { font-size: var(--fs-xl) !important; }
      .kpi-card { padding: var(--space-4) !important; }
      .rt-grid { grid-template-columns: 1fr !important; }
      .summary-bar { grid-template-columns: repeat(2,1fr) !important; }
      .px-table .col-hide-mobile { display: none !important; }
    }

    /* ── Accesibilidad: reduced-motion ─────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .scan-line { display: none; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

{% if messages %}
<div class="toast-stack" id="toast-stack">
  {% for message in messages %}
  <div class="toast
    {% if 'success' in message.tags %}toast-success
    {% elif 'error' in message.tags %}toast-error
    {% elif 'warning' in message.tags %}toast-warning
    {% else %}toast-info{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
<script>setTimeout(()=>{const t=document.getElementById('toast-stack');if(t)t.remove();},4000);</script>
{% endif %}

{% block body %}{% endblock %}
</body>
</html>
